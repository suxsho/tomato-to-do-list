name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: tomato_timer

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          # runner 镜像预装 libunwind8=1.3.2-2build2.1（安全更新版），
          # 但 jammy 的 libunwind-dev 硬依赖 libunwind8 (= 1.3.2-2build2)，严格等号。
          # apt 默认拒绝降级，于是 libgstreamer1.0-dev 的依赖链被判定为"解不开"。
          # 显式允许降级即可，别和其余包混在一起装。
          sudo apt-get install -y --allow-downgrades libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev zenity file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release
        run: flutter build linux --release

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Pack tar.gz
        shell: bash
        run: |
          cd build/linux/x64/release
          tar -czf "tomato_timer-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" bundle

      - name: Pack AppImage
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp linux/packaging/AppRun "$APPDIR/AppRun"
          cp linux/packaging/tomato_timer.desktop "$APPDIR/tomato_timer.desktop"
          cp assets/icon/tomato_256.png "$APPDIR/tomato_timer.png"
          sed -i 's/\r$//' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q -P "$RUNNER_TEMP" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          # 下载到 RUNNER_TEMP，避免工具本身被 artifacts 的通配符顺手打包进去
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool-x86_64.AppImage" --appimage-extract-and-run "$APPDIR" "tomato_timer-$VER-linux-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tomato-timer-linux
          path: |
            tomato_timer/build/linux/x64/release/*.tar.gz
            tomato_timer/tomato_timer-*-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            tomato_timer/build/linux/x64/release/*.tar.gz
            tomato_timer/tomato_timer-*-linux-x86_64.AppImage
