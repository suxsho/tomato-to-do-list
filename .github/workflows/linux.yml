name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: tomato_timer

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev zenity file

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release
        run: flutter build linux --release

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Pack tar.gz
        shell: bash
        run: |
          cd build/linux/x64/release
          tar -czf "tomato_timer-${{ steps.ver.outputs.version }}-linux-x64.tar.gz" bundle

      - name: Pack AppImage
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp linux/packaging/AppRun "$APPDIR/AppRun"
          cp linux/packaging/tomato_timer.desktop "$APPDIR/tomato_timer.desktop"
          cp assets/icon/tomato_256.png "$APPDIR/tomato_timer.png"
          sed -i 's/\r$//' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" "tomato_timer-$VER-linux-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tomato-timer-linux
          path: |
            tomato_timer/build/linux/x64/release/*.tar.gz
            tomato_timer/*.AppImage
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tomato_timer/build/linux/x64/release/*.tar.gz
            tomato_timer/*.AppImage
